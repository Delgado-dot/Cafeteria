name: Bug Report
description: Reporta un error en el sistema
title: "[BUG] - "
labels: ["bug"]
assignees: []

body:
  - type: input
    id: sistema
    attributes:
      label: Sistema / Módulo
      description: ¿En qué parte del sistema ocurrió el error? (Login, Menú, Pedidos, Admin, etc.)
      placeholder: "Ej: Pedidos"
    validations:
      required: true

  - type: input
    id: navegador
    attributes:
      label: Navegador
      description: Navegador y versión utilizada
      placeholder: "Chrome 120"
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Describe los pasos exactos para reproducir el error
      placeholder: |
        1. Ir a ...
        2. Click en ...
        3. Error / problema
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: ¿Qué debería ocurrir?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: ¿Qué ocurrió realmente?
    validations:
      required: true

  - type: input
    id: captura
    attributes:
      label: Captura de pantalla
      description: URL de la captura (opcional)
