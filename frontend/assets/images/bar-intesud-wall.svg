<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spotL" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f5e6c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9b8a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotR" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#f0dfb8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c9b8a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d6a45"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#7a5430"/>
    </linearGradient>
    <filter id="softShadow2">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Base warm concrete -->
  <rect width="1600" height="1000" fill="#d8c9b6"/>
  <rect width="1600" height="1000" fill="url(#concrete)" opacity="0"/>
  <!-- Vertical joints like original -->
  <g stroke="#b8a898" stroke-width="1.3" opacity="0.6">
    <line x1="280" y1="0" x2="280" y2="920"/>
    <line x1="1320" y1="0" x2="1320" y2="920"/>
  </g>
  <!-- Warm concrete texture overlay -->
  <rect width="1600" height="920" fill="#cbb8a0" opacity="0.55"/>
  <g opacity="0.08">
    <rect x="0" y="0" width="1600" height="920" fill="url(#noise)"/>
  </g>
  <!-- Spotlights -->
  <ellipse cx="320" cy="0" rx="520" ry="420" fill="url(#spotL)"/>
  <ellipse cx="1280" cy="0" rx="480" ry="400" fill="url(#spotR)"/>
  <!-- S Logo -->
  <g transform="translate(800, 380)" filter="url(#softShadow2)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="'Arial Black', Arial, sans-serif" font-size="240" font-weight="900"
      fill="none" stroke="#7fcfc8" stroke-width="9" stroke-linejoin="round" opacity="0.95"
      style="paint-order: stroke;">S</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="'Arial Black', Arial, sans-serif" font-size="240" font-weight="900"
      fill="#2e2e2e">S</text>
  </g>
  <!-- Bar Intesud text -->
  <g text-anchor="middle" filter="url(#softShadow2)">
    <text x="635" y="500" font-family="'Arial Black', Arial, sans-serif" font-size="54" font-weight="900" fill="#2e2e2e" stroke="#c8ece9" stroke-width="0.6" style="paint-order: stroke;">Bar</text>
    <text x="800" y="560" font-family="'Arial Black', Arial, sans-serif" font-size="58" font-weight="900" fill="#2e2e2e" stroke="#c8ece9" stroke-width="0.6" style="paint-order: stroke;">Intesud</text>
  </g>
  <!-- Coffee beans / hops bottom left -->
  <g opacity="0.38" stroke="#e8dcc0" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- beans -->
    <ellipse cx="140" cy="750" rx="22" ry="34" transform="rotate(-18 140 750)"/>
    <path d="M 140 720 Q 142 750 140 780"/>
    <ellipse cx="240" cy="735" rx="26" ry="38" transform="rotate(22 240 735)"/>
    <path d="M 233 704 Q 242 735 233 766"/>
    <ellipse cx="330" cy="735" rx="26" ry="38" transform="rotate(-12 330 735)"/>
    <path d="M 325 704 Q 331 735 325 766"/>
    <ellipse cx="380" cy="800" rx="24" ry="34" transform="rotate(18 380 800)"/>
    <path d="M 375 770 Q 381 800 375 830"/>
    <!-- hops -->
    <g transform="translate(160, 810) scale(0.9)">
      <path d="M0 -28 L 12 -12 L 18 6 L 6 18 L -6 18 L -18 6 L -12 -12 Z"/>
      <path d="M0 -28 Q -4 -18 -2 -8 Q 2 -18 0 -28"/>
      <path d="M-12 -12 Q -8 -4 -6 18"/>
      <path d="M12 -12 Q 8 -4 6 18"/>
      <path d="M-18 6 Q -10 2 -6 18"/>
      <path d="M18 6 Q 10 2 6 18"/>
    </g>
    <g transform="translate(280, 820) scale(0.95)">
      <path d="M0 -30 L 13 -13 L 19 7 L 7 20 L -7 20 L -19 7 L -13 -13 Z"/>
      <path d="M0 -30 Q -4 -19 -2 -9 Q 2 -19 0 -30"/>
    </g>
  </g>
  <!-- Coffee beans / hops bottom right -->
  <g opacity="0.38" stroke="#e8dcc0" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1220" cy="735" rx="26" ry="38" transform="rotate(-16 1220 735)"/>
    <path d="M 1215 704 Q 1221 735 1215 766"/>
    <ellipse cx="1320" cy="735" rx="26" ry="38" transform="rotate(14 1320 735)"/>
    <path d="M 1315 704 Q 1321 735 1315 766"/>
    <ellipse cx="1410" cy="750" rx="20" ry="32" transform="rotate(-10 1410 750)"/>
    <path d="M 1406 722 Q 1410 750 1406 778"/>
    <ellipse cx="1200" cy="800" rx="24" ry="34" transform="rotate(-20 1200 800)"/>
    <path d="M 1195 770 Q 1201 800 1195 830"/>
    <g transform="translate(1320, 810) scale(0.9)">
      <path d="M0 -28 L 12 -12 L 18 6 L 6 18 L -6 18 L -18 6 L -12 -12 Z"/>
      <path d="M0 -28 Q -4 -18 -2 -8 Q 2 -18 0 -28"/>
    </g>
    <g transform="translate(1420, 815) scale(0.85)">
      <path d="M0 -28 L 12 -12 L 18 6 L 6 18 L -6 18 L -18 6 L -12 -12 Z"/>
    </g>
  </g>
  <!-- Wood ledge at bottom -->
  <rect x="0" y="920" width="1600" height="80" fill="url(#wood)"/>
  <rect x="0" y="920" width="1600" height="8" fill="black" opacity="0.18"/>
  <!-- Wood grain lines -->
  <g stroke="#5a3d1e" opacity="0.18" stroke-width="1.2">
    <path d="M 0 945 Q 200 930 400 945 T 800 950 T 1200 945 T 1600 950"/>
    <path d="M 0 965 Q 300 955 600 965 T 1000 970 T 1600 960"/>
  </g>
  <!-- Vignette edges -->
  <rect width="1600" height="1000" fill="none" stroke="black" stroke-width="80" opacity="0.08" style="filter: blur(20px);"/>
</svg>
