<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="concreteBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#ededed"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#concreteBg)"/>
  <!-- Vertical concrete joints -->
  <g stroke="#d2d2d2" stroke-width="1.2" opacity="0.9">
    <line x1="267" y1="0" x2="267" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1333" y1="0" x2="1333" y2="1000"/>
  </g>
  <!-- Subtle vertical streaks -->
  <g opacity="0.07">
    <rect x="180" y="0" width="18" height="1000" fill="#b0b0b0"/>
    <rect x="620" y="0" width="12" height="1000" fill="#a8a8a8"/>
    <rect x="1180" y="0" width="22" height="1000" fill="#bbbbbb"/>
  </g>
  <!-- Light vignette shadow on right -->
  <ellipse cx="1350" cy="500" rx="280" ry="420" fill="white" opacity="0.18"/>
  <!-- S Logo -->
  <g transform="translate(800, 360)" filter="url(#softShadow)">
    <!-- Teal outline -->
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="'Arial Black', Arial, sans-serif" font-size="260" font-weight="900"
      fill="none" stroke="#7fcfc8" stroke-width="10" stroke-linejoin="round" opacity="0.95"
      style="paint-order: stroke;">S</text>
    <!-- Inner dark S -->
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="'Arial Black', Arial, sans-serif" font-size="260" font-weight="900"
      fill="#2e2e2e" stroke="#2e2e2e" stroke-width="2">S</text>
    <!-- Highlight -->
    <text x="-4" y="-6" text-anchor="middle" dominant-baseline="middle"
      font-family="'Arial Black', Arial, sans-serif" font-size="260" font-weight="900"
      fill="none" stroke="white" stroke-width="1.5" opacity="0.18">S</text>
  </g>
  <!-- Texts -->
  <text x="800" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
    font-size="22" font-weight="600" letter-spacing="3.2" fill="#2a2a2a">INSTITUTO SUPERIOR TECNOLÓGICO</text>
  <text x="800" y="585" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
    font-size="58" font-weight="900" letter-spacing="1.5" fill="#111111">SUDAMERICANO</text>
  <text x="800" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
    font-size="17" font-weight="400" fill="#3a3a3a">Quito, Ecuador</text>
  <text x="800" y="670" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive"
    font-size="42" font-style="italic" fill="#1e1e1e">Yo soy del INTESUD</text>
</svg>
