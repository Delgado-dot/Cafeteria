<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de pedidos de la cafetería INTESUD — Prototipo frontend funcional">
  <title>Cafetería INTESUD — Pedidos en línea</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .admin-product-icon{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);display:inline-flex;align-items:center;justify-content:center;font-size:1.65rem;flex-shrink:0}.admin-product-icon.sm{width:36px;height:36px;border-radius:10px;font-size:1.2rem}.admin-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:92px}.delivery-hero{display:flex;align-items:center;gap:12px;padding:14px;background:var(--primary-soft);border-radius:var(--r-lg);margin-bottom:20px}.delivery-hero h3{margin:0}.delivery-hero p{margin:3px 0 0}.delivery-hero-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:1.7rem;border-radius:16px;box-shadow:var(--shadow-primary)}.delivery-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.delivery-option-grid.compact{grid-template-columns:1fr}.delivery-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer}.delivery-option>span:nth-child(2){min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}.delivery-option small{color:var(--text-3);font-size:var(--fs-xs)}.delivery-option-icon{min-width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-strong);font-weight:var(--fw-bold)}@media(max-width:768px){.delivery-option-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Orden de carga: primero helpers y datos, luego módulos de lógica -->
  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/devadmin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
